<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor - Varian Music</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #12172a;
      --bg-card: #1a1f35;
      --accent: #6366f1;
      --accent-hover: #5558e3;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVIGATION */
    .nav-bar {
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(18, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(99, 102, 241, 0.1);
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.1);
      border: none;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: var(--accent);
      transform: scale(1.05);
    }

    .nav-actions {
      display: flex;
      gap: 0.5rem;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.1);
      border: none;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: var(--accent);
    }

    .nav-btn.active {
      background: var(--accent);
      color: white;
    }

    /* PLAYER CONTAINER */
    .player-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    /* COVER ART */
    .cover-wrapper {
      position: relative;
      width: 100%;
      max-width: 350px;
      margin-bottom: 2rem;
    }

    .cover-art {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .playing-animation {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      width: 44px;
      height: 44px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      border-radius: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px;
    }

    .playing-animation.playing {
      display: flex;
    }

    .bar {
      width: 3px;
      height: 18px;
      background: var(--accent);
      border-radius: 2px;
      animation: equalizer 0.8s ease-in-out infinite;
    }

    .bar:nth-child(1) { animation-delay: 0s; }
    .bar:nth-child(2) { animation-delay: 0.2s; }
    .bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes equalizer {
      0%, 100% { height: 8px; }
      50% { height: 18px; }
    }

    /* SONG INFO */
    .song-info {
      text-align: center;
      margin-bottom: 1.5rem;
      width: 100%;
    }

    .song-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .song-artist {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* PROGRESS BAR */
    .progress-section {
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .progress-bar-wrapper {
      position: relative;
      height: 6px;
      background: rgba(99, 102, 241, 0.2);
      border-radius: 3px;
      cursor: pointer;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      width: 0%;
      transition: width 0.1s linear;
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .progress-bar-wrapper:hover .progress-bar-fill::after {
      opacity: 1;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(99, 102, 241, 0.1);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }

    .control-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      transform: scale(1.05);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn.active {
      background: var(--accent);
      color: white;
    }

    .play-pause-btn {
      width: 64px;
      height: 64px;
      background: var(--accent);
      font-size: 1.5rem;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .play-pause-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.1);
    }

    /* VOLUME */
    .volume-section {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .volume-icon {
      color: var(--text-secondary);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .volume-slider {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(99, 102, 241, 0.2);
      border-radius: 2px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    /* VIDEO */
    .video-wrapper {
      width: 100%;
      max-width: 350px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 2rem;
      display: none;
    }

    .video-wrapper.active {
      display: block;
    }

    video {
      width: 100%;
      display: block;
      background: black;
    }

    /* MEDIA TOGGLE */
    .media-toggle {
      display: none;
      gap: 0.5rem;
      padding: 0.25rem;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 10px;
      margin-bottom: 1.5rem;
    }

    .media-toggle.active {
      display: flex;
    }

    .media-btn {
      flex: 1;
      padding: 0.5rem 1rem;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .media-btn.active {
      background: var(--accent);
      color: white;
    }

    /* LOADING */
    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      z-index: 1000;
    }

    .loading.hidden {
      display: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .player-container {
        padding: 1rem;
      }

      .cover-wrapper {
        max-width: 280px;
      }

      .song-title {
        font-size: 1.25rem;
      }

      .song-artist {
        font-size: 0.9rem;
      }

      .controls {
        gap: 0.75rem;
      }

      .control-btn {
        width: 42px;
        height: 42px;
        font-size: 1rem;
      }

      .play-pause-btn {
        width: 56px;
        height: 56px;
        font-size: 1.25rem;
      }
    }

    @media (min-width: 769px) {
      .player-container {
        padding: 3rem 2rem;
      }

      .cover-wrapper {
        max-width: 420px;
      }

      .song-title {
        font-size: 2rem;
      }

      .song-artist {
        font-size: 1.25rem;
      }

      .controls {
        gap: 1.5rem;
      }

      .control-btn {
        width: 54px;
        height: 54px;
        font-size: 1.25rem;
      }

      .play-pause-btn {
        width: 72px;
        height: 72px;
        font-size: 1.75rem;
      }
    }

    .hidden {
      display: none !important;
    }

    /* PLAYLIST MODAL */
    .playlist-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .playlist-modal.active {
      display: flex;
    }

    .playlist-content {
      background: var(--bg-secondary);
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .playlist-header {
      padding: 1.5rem;
      border-bottom: 1px solid rgba(99, 102, 241, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
    }

    .close-modal {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.1);
      border: none;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.25rem;
    }

    .close-modal:hover {
      background: var(--accent);
    }

    .playlist-body {
      padding: 1rem;
    }

    .create-playlist {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .playlist-input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border: 2px solid rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .playlist-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .create-btn {
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .create-btn:hover {
      background: var(--accent-hover);
    }

    .playlists-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .playlist-item {
      padding: 1rem;
      background: var(--bg-card);
      border: 1px solid rgba(99, 102, 241, 0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .playlist-item:hover {
      background: rgba(99, 102, 241, 0.1);
      border-color: var(--accent);
    }

    .playlist-icon {
      width: 44px;
      height: 44px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .playlist-info {
      flex: 1;
      min-width: 0;
    }

    .playlist-name {
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 0.25rem 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-count {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin: 0;
    }

    .empty-playlists {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-secondary);
    }

    .empty-playlists i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
  </div>

  <!-- NAVIGATION -->
  <nav class="nav-bar">
    <button class="back-btn" onclick="window.location.href='index.html'">
      <i class="bi bi-chevron-left"></i>
    </button>
    <div class="nav-actions">
      <button class="nav-btn" id="playlistBtn" title="Añadir a playlist">
        <i class="bi bi-music-note-list"></i>
      </button>
      <button class="nav-btn" id="shareBtn" title="Compartir">
        <i class="bi bi-share-fill"></i>
      </button>
      <button class="nav-btn" id="favoriteBtn" title="Favoritos">
        <i class="bi bi-heart"></i>
      </button>
    </div>
  </nav>

  <!-- PLAYER -->
  <div class="player-container">
    
    <!-- MEDIA TOGGLE -->
    <div class="media-toggle" id="mediaToggle">
      <button class="media-btn active" data-mode="audio">
        <i class="bi bi-music-note-beamed"></i>
        Audio
      </button>
      <button class="media-btn" data-mode="video">
        <i class="bi bi-camera-video"></i>
        Video
      </button>
    </div>

    <!-- VIDEO -->
    <div class="video-wrapper" id="videoWrapper">
      <video id="video" controls></video>
    </div>

    <!-- COVER ART -->
    <div class="cover-wrapper" id="coverWrapper">
      <img id="cover" class="cover-art" src="" alt="Cover">
      <div class="playing-animation" id="playingAnimation">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <!-- SONG INFO -->
    <div class="song-info">
      <h1 class="song-title" id="titulo">Cargando...</h1>
      <p class="song-artist" id="artista">-</p>
    </div>

    <!-- PROGRESS -->
    <div class="progress-section">
      <div class="time-labels">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
      <div class="progress-bar-wrapper" id="progressBar">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="control-btn" id="shuffleBtn" title="Aleatorio">
        <i class="bi bi-shuffle"></i>
      </button>
      <button class="control-btn" id="prevBtn" title="Anterior">
        <i class="bi bi-skip-start-fill"></i>
      </button>
      <button class="control-btn play-pause-btn" id="playPauseBtn">
        <i class="bi bi-play-fill"></i>
      </button>
      <button class="control-btn" id="nextBtn" title="Siguiente">
        <i class="bi bi-skip-end-fill"></i>
      </button>
      <button class="control-btn" id="repeatBtn" title="Repetir">
        <i class="bi bi-arrow-repeat"></i>
      </button>
    </div>

    <!-- VOLUME -->
    <div class="volume-section">
      <i class="bi bi-volume-up-fill volume-icon" id="volumeIcon"></i>
      <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
    </div>

  </div>

  <!-- PLAYLIST MODAL -->
  <div class="playlist-modal" id="playlistModal">
    <div class="playlist-content">
      <div class="playlist-header">
        <h3 class="playlist-title">Añadir a playlist</h3>
        <button class="close-modal" id="closePlaylistModal">
          <i class="bi bi-x"></i>
        </button>
      </div>
      <div class="playlist-body">
        <div class="create-playlist">
          <input 
            type="text" 
            class="playlist-input" 
            id="newPlaylistInput" 
            placeholder="Nueva playlist..."
            maxlength="50"
          >
          <button class="create-btn" id="createPlaylistBtn">
            <i class="bi bi-plus-lg"></i> Crear
          </button>
        </div>
        <div class="playlists-list" id="playlistsList">
          <div class="empty-playlists">
            <i class="bi bi-music-note-list"></i>
            <p>No tienes playlists aún</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";
    import { 
      addToFavorites, 
      removeFromFavorites, 
      isFavorite, 
      addToHistory, 
      registerView,
      getUserPlaylists,
      createPlaylist,
      addSongToPlaylist
    } from "../assets/js/metrics.js";

    const params = new URLSearchParams(window.location.search);
    let songId = params.get("id");
    const initialMode = params.get("mode") || "audio";
    
    let allSongs = [];
    let currentIndex = 0;
    let isFav = false;
    let isRepeat = false;
    let isShuffle = false;
    let currentMode = initialMode;
    let currentMedia = null;
    let songData = null;
    let userPlaylists = [];

    // Elements
    const loading = document.getElementById("loading");
    const cover = document.getElementById("cover");
    const titulo = document.getElementById("titulo");
    const artista = document.getElementById("artista");
    const audio = document.getElementById("audio");
    const video = document.getElementById("video");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const playingAnimation = document.getElementById("playingAnimation");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeIcon = document.getElementById("volumeIcon");
    const mediaToggle = document.getElementById("mediaToggle");
    const videoWrapper = document.getElementById("videoWrapper");
    const coverWrapper = document.getElementById("coverWrapper");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const repeatBtn = document.getElementById("repeatBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    // ============================================
    // CARGAR TODAS LAS CANCIONES
    // ============================================
    async function loadAllSongs() {
      const { data, error } = await supabase
        .from('songs')
        .select(`
          id,
          titulo,
          thumbnail_url,
          audio_url,
          video_url,
          artists(name)
        `)
        .order('created_at', { ascending: false });

      if (!error && data) {
        allSongs = data;
        currentIndex = allSongs.findIndex(s => s.id === songId);
      }
    }

    // ============================================
    // CARGAR CANCIÓN
    // ============================================
    async function loadSong() {
      try {
        const { data, error } = await supabase
          .from("songs")
          .select(`
            id,
            titulo,
            thumbnail_url,
            audio_url,
            video_url,
            artists(name)
          `)
          .eq("id", songId)
          .single();

        if (error || !data) {
          Swal.fire('Error', 'No se pudo cargar la canción', 'error');
          window.location.href = "index.html";
          return;
        }

        songData = data;
        
        titulo.textContent = data.titulo;
        artista.textContent = data.artists?.name || 'Artista Desconocido';
        cover.src = data.thumbnail_url;

        // Mostrar toggle si tiene video
        if (data.video_url) {
          mediaToggle.classList.add('active');
        } else {
          mediaToggle.classList.remove('active');
        }

        // Cargar modo inicial
        switchMode(currentMode);
        
        // Registrar métricas
        registerView(songId);
        addToHistory(songId);
        
        // Verificar favorito
        isFav = await isFavorite(songId);
        updateFavoriteButton();
        
        loading.classList.add('hidden');
      } catch (err) {
        console.error(err);
        Swal.fire('Error', 'Error cargando la canción', 'error');
      }
    }

    // ============================================
    // CAMBIAR ENTRE AUDIO Y VIDEO
    // ============================================
    function switchMode(mode) {
      currentMode = mode;
      
      if (currentMedia) {
        currentMedia.pause();
        currentMedia.currentTime = 0;
      }

      if (mode === 'video' && songData.video_url) {
        videoWrapper.classList.add('active');
        coverWrapper.classList.add('hidden');
        video.src = songData.video_url;
        currentMedia = video;
        
        document.querySelectorAll('.media-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === 'video');
        });
      } else {
        videoWrapper.classList.remove('active');
        coverWrapper.classList.remove('hidden');
        audio.src = songData.audio_url;
        currentMedia = audio;
        
        document.querySelectorAll('.media-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === 'audio');
        });
      }

      currentMedia.volume = volumeSlider.value / 100;
      currentMedia.play().catch(err => console.log('Autoplay prevented'));
    }

    // Media toggle
    document.querySelectorAll('.media-btn').forEach(btn => {
      btn.addEventListener('click', () => switchMode(btn.dataset.mode));
    });

    // ============================================
    // CONTROLES DE REPRODUCCIÓN
    // ============================================
    playPauseBtn.addEventListener('click', () => {
      if (currentMedia.paused) {
        currentMedia.play();
      } else {
        currentMedia.pause();
      }
    });

    function updatePlayButton() {
      const icon = playPauseBtn.querySelector('i');
      if (currentMedia.paused) {
        icon.className = 'bi bi-play-fill';
        playingAnimation.classList.remove('playing');
      } else {
        icon.className = 'bi bi-pause-fill';
        playingAnimation.classList.add('playing');
      }
    }

    // ============================================
    // NAVEGACIÓN
    // ============================================
    prevBtn.addEventListener('click', () => {
      if (currentMedia.currentTime > 3) {
        currentMedia.currentTime = 0;
      } else {
        playPreviousSong();
      }
    });

    nextBtn.addEventListener('click', () => {
      playNextSong();
    });

    function playPreviousSong() {
      if (allSongs.length === 0) return;
      
      currentIndex = currentIndex > 0 ? currentIndex - 1 : allSongs.length - 1;
      songId = allSongs[currentIndex].id;
      loadSong();
    }

    function playNextSong() {
      if (allSongs.length === 0) return;
      
      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * allSongs.length);
      } else {
        currentIndex = (currentIndex + 1) % allSongs.length;
      }
      
      songId = allSongs[currentIndex].id;
      loadSong();
    }

    // Cuando termina la canción
    [audio, video].forEach(media => {
      media.addEventListener('ended', () => {
        if (isRepeat) {
          currentMedia.currentTime = 0;
          currentMedia.play();
        } else {
          playNextSong();
        }
      });
    });

    // ============================================
    // SHUFFLE Y REPEAT
    // ============================================
    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
    });

    repeatBtn.addEventListener('click', () => {
      isRepeat = !isRepeat;
      repeatBtn.classList.toggle('active', isRepeat);
    });

    // ============================================
    // FAVORITOS
    // ============================================
    function updateFavoriteButton() {
      const icon = document.getElementById('favoriteBtn').querySelector('i');
      if (isFav) {
        icon.className = 'bi bi-heart-fill';
        document.getElementById('favoriteBtn').classList.add('active');
      } else {
        icon.className = 'bi bi-heart';
        document.getElementById('favoriteBtn').classList.remove('active');
      }
    }

    document.getElementById('favoriteBtn').addEventListener('click', async () => {
      try {
        if (isFav) {
          await removeFromFavorites(songId);
          isFav = false;
          Swal.fire({
            icon: 'info',
            title: 'Removido',
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2000
          });
        } else {
          await addToFavorites(songId);
          isFav = true;
          Swal.fire({
            icon: 'success',
            title: '¡Añadido!',
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2000
          });
        }
        updateFavoriteButton();
      } catch (err) {
        Swal.fire('Error', err.message, 'error');
      }
    });

    // ============================================
    // COMPARTIR
    // ============================================
    document.getElementById('shareBtn').addEventListener('click', async () => {
      if (navigator.share) {
        try {
          await navigator.share({
            title: songData.titulo,
            text: `Escucha ${songData.titulo}`,
            url: window.location.href
          });
        } catch (err) {
          console.log('Share cancelled');
        }
      } else {
        await navigator.clipboard.writeText(window.location.href);
        Swal.fire({
          icon: 'success',
          title: 'Enlace copiado',
          toast: true,
          position: 'top-end',
          showConfirmButton: false,
          timer: 2000
        });
      }
    });

    // ============================================
    // PROGRESO
    // ============================================
    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function updateProgress() {
      if (!currentMedia) return;
      
      const percent = (currentMedia.currentTime / currentMedia.duration) * 100;
      progressFill.style.width = `${percent}%`;
      currentTimeEl.textContent = formatTime(currentMedia.currentTime);
      durationEl.textContent = formatTime(currentMedia.duration);
    }

    progressBar.addEventListener('click', (e) => {
      if (!currentMedia) return;
      
      const rect = progressBar.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      currentMedia.currentTime = percent * currentMedia.duration;
    });

    // ============================================
    // VOLUMEN
    // ============================================
    volumeSlider.addEventListener('input', (e) => {
      if (!currentMedia) return;
      
      const volume = e.target.value / 100;
      currentMedia.volume = volume;
      
      if (volume === 0) {
        volumeIcon.className = 'bi bi-volume-mute-fill volume-icon';
      } else if (volume < 0.5) {
        volumeIcon.className = 'bi bi-volume-down-fill volume-icon';
      } else {
        volumeIcon.className = 'bi bi-volume-up-fill volume-icon';
      }
    });

    volumeIcon.addEventListener('click', () => {
      if (!currentMedia) return;
      
      if (currentMedia.volume > 0) {
        currentMedia.volume = 0;
        volumeSlider.value = 0;
        volumeIcon.className = 'bi bi-volume-mute-fill volume-icon';
      } else {
        currentMedia.volume = 0.7;
        volumeSlider.value = 70;
        volumeIcon.className = 'bi bi-volume-up-fill volume-icon';
      }
    });

    // ============================================
    // EVENT LISTENERS
    // ============================================
    [audio, video].forEach(media => {
      media.addEventListener('play', updatePlayButton);
      media.addEventListener('pause', updatePlayButton);
      media.addEventListener('timeupdate', updateProgress);
      media.addEventListener('loadedmetadata', updateProgress);
    });

    // ============================================
    // TECLADO
    // ============================================
    document.addEventListener('keydown', (e) => {
      if (!currentMedia) return;
      
      switch(e.code) {
        case 'Space':
          e.preventDefault();
          playPauseBtn.click();
          break;
        case 'ArrowLeft':
          currentMedia.currentTime = Math.max(0, currentMedia.currentTime - 5);
          break;
        case 'ArrowRight':
          currentMedia.currentTime = Math.min(currentMedia.duration, currentMedia.currentTime + 5);
          break;
        case 'ArrowUp':
          e.preventDefault();
          volumeSlider.value = Math.min(100, parseInt(volumeSlider.value) + 10);
          volumeSlider.dispatchEvent(new Event('input'));
          break;
        case 'ArrowDown':
          e.preventDefault();
          volumeSlider.value = Math.max(0, parseInt(volumeSlider.value) - 10);
          volumeSlider.dispatchEvent(new Event('input'));
          break;
      }
    });

    // ============================================
    // PLAYLISTS
    // ============================================
    const playlistModal = document.getElementById('playlistModal');
    const playlistsList = document.getElementById('playlistsList');
    const newPlaylistInput = document.getElementById('newPlaylistInput');

    // Abrir modal de playlists
    document.getElementById('playlistBtn').addEventListener('click', async () => {
      playlistModal.classList.add('active');
      await loadUserPlaylists();
    });

    // Cerrar modal
    document.getElementById('closePlaylistModal').addEventListener('click', () => {
      playlistModal.classList.remove('active');
      newPlaylistInput.value = '';
    });

    // Cerrar al hacer clic fuera
    playlistModal.addEventListener('click', (e) => {
      if (e.target === playlistModal) {
        playlistModal.classList.remove('active');
        newPlaylistInput.value = '';
      }
    });

    // Cargar playlists del usuario
    async function loadUserPlaylists() {
      try {
        userPlaylists = await getUserPlaylists();
        renderPlaylists();
      } catch (err) {
        console.error('Error cargando playlists:', err);
        Swal.fire('Error', 'No se pudieron cargar las playlists', 'error');
      }
    }

    // Renderizar playlists
    function renderPlaylists() {
      if (userPlaylists.length === 0) {
        playlistsList.innerHTML = `
          <div class="empty-playlists">
            <i class="bi bi-music-note-list"></i>
            <p>No tienes playlists aún</p>
          </div>
        `;
        return;
      }

      playlistsList.innerHTML = userPlaylists.map(playlist => `
        <div class="playlist-item" onclick="addToPlaylistHandler('${playlist.id}')">
          <div class="playlist-icon">
            <i class="bi bi-music-note-list"></i>
          </div>
          <div class="playlist-info">
            <p class="playlist-name">${playlist.nombre}</p>
            <p class="playlist-count">${playlist.playlist_songs?.[0]?.count || 0} canciones</p>
          </div>
        </div>
      `).join('');
    }

    // Crear nueva playlist
    document.getElementById('createPlaylistBtn').addEventListener('click', async () => {
      const nombre = newPlaylistInput.value.trim();
      
      if (!nombre) {
        Swal.fire('Error', 'Escribe un nombre para la playlist', 'error');
        return;
      }

      try {
        const newPlaylist = await createPlaylist(nombre);
        
        Swal.fire({
          icon: 'success',
          title: '¡Playlist creada!',
          toast: true,
          position: 'top-end',
          showConfirmButton: false,
          timer: 2000
        });

        newPlaylistInput.value = '';
        await loadUserPlaylists();
      } catch (err) {
        console.error('Error creando playlist:', err);
        Swal.fire('Error', 'No se pudo crear la playlist', 'error');
      }
    });

    // Añadir canción a playlist
    window.addToPlaylistHandler = async function(playlistId) {
      try {
        await addSongToPlaylist(playlistId, songId);
        
        playlistModal.classList.remove('active');
        
        Swal.fire({
          icon: 'success',
          title: '¡Añadida a la playlist!',
          toast: true,
          position: 'top-end',
          showConfirmButton: false,
          timer: 2000
        });
      } catch (err) {
        console.error('Error añadiendo a playlist:', err);
        
        if (err.message?.includes('duplicate')) {
          Swal.fire({
            icon: 'info',
            title: 'Ya está en esta playlist',
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2000
          });
        } else {
          Swal.fire('Error', 'No se pudo añadir a la playlist', 'error');
        }
      }
    };

    // Enter para crear playlist
    newPlaylistInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('createPlaylistBtn').click();
      }
    });

    // ============================================
    // INICIAR
    // ============================================
    async function init() {
      await loadAllSongs();
      await loadSong();
    }

    init();
  </script>

</body>
</html>
