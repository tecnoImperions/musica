<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Varian | Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root { 
            --bg: #05070a; --surface: #0a0e17; --field: #131926; 
            --accent: #6366f1; --text: #ffffff; --text-dim: #94a3b8; 
            --border: #1e293b;
        }
        
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        .app-shell { display: flex; height: 100vh; }

        /* --- SIDEBAR --- */
        .sidebar { width: 260px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; color: var(--accent); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-dim); text-decoration: none; border-radius: 12px; margin-bottom: 5px; font-weight: 600; }
        .nav-item:hover, .nav-item.active { background: var(--surface); color: var(--accent); }

        /* --- CONTENIDO --- */
        .content-area { flex-grow: 1; overflow-y: auto; padding: 40px; }
        
        /* --- USER CARDS --- */
        .u-card { 
            background: var(--surface); 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .u-card:hover { border-color: var(--accent); transform: translateY(-3px); background: #0f172a; }
        .u-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
        
        /* --- PANEL LATERAL --- */
        .offcanvas { background: var(--surface) !important; color: white; border-left: 1px solid var(--border) !important; }
        .detail-header { text-align: center; padding: 20px 0; }
        .detail-avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 15px; }

        /* --- RESPONSIVE --- */
        @media (max-width: 991px) {
            .sidebar { width: 100%; height: 70px; position: fixed; bottom: 0; flex-direction: row; padding: 5px; z-index: 1000; border-top: 1px solid var(--border); border-right: none; }
            .brand, .nav-item span { display: none; }
            .nav-links { display: flex; width: 100%; justify-content: space-around; align-items: center; }
            .content-area { padding: 20px 15px 100px 15px; }
            .offcanvas { width: 100% !important; } /* En móvil ocupa todo */
        }
    </style>
</head>
<body>

<div class="app-shell">
    <nav class="sidebar">
        <div class="brand"><i class="bi bi-vimeo"></i> <span>VARIAN</span></div>
        <div class="nav-links">
            <a href="index.html" class="nav-item"><i class="bi bi-cloud-arrow-up"></i> <span>Subir</span></a>
            <a href="canciones.html" class="nav-item"><i class="bi bi-music-note-list"></i> <span>Catálogo</span></a>
            <a href="usuarios.html" class="nav-item active"><i class="bi bi-people"></i> <span>Usuarios</span></a>
            <a href="perfil.html" class="nav-item"><i class="bi bi-person-circle"></i> <span>Perfil</span></a>
        </div>
    </nav>

    <main class="content-area">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0">Comunidad Varian</h2>
            <div class="position-relative">
                <input type="text" id="userSearch" class="form-control bg-dark border-secondary text-white rounded-pill px-4" style="font-size: 0.9rem;" placeholder="Buscar usuario...">
            </div>
        </div>

        <div class="row g-3" id="u-list">
            </div>
    </main>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="userPanel">
    <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="fw-bold m-0">Detalles del Perfil</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body" id="userContent">
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { supabase } from "../../assets/js/supabase.js";

    let users = [];
    const offcanvas = new bootstrap.Offcanvas('#userPanel');

    async function load() {
        const { data, error } = await supabase.from('profiles').select('*').order('created_at', {ascending: false});
        if (!error) {
            users = data;
            render();
        }
    }

    function render() {
        const query = document.getElementById('userSearch').value.toLowerCase();
        const filtered = users.filter(u => 
            (u.username && u.username.toLowerCase().includes(query)) || 
            (u.email && u.email.toLowerCase().includes(query))
        );

        document.getElementById('u-list').innerHTML = filtered.map(u => `
            <div class="col-12 col-md-6 col-lg-4">
                <div class="u-card" onclick="window.showUser('${u.id}')">
                    <img src="${u.avatar_url || 'https://ui-avatars.com/api/?name=' + (u.username || 'U') + '&background=6366f1&color=fff'}" class="u-avatar">
                    <div class="text-truncate">
                        <div class="fw-bold text-white">${u.username || 'Usuario Nuevo'}</div>
                        <div class="small text-dim">${u.email}</div>
                    </div>
                    <div class="ms-auto">
                        ${u.is_admin ? '<i class="bi bi-patch-check-fill text-primary"></i>' : '<i class="bi bi-person text-dim"></i>'}
                    </div>
                </div>
            </div>
        `).join('');
    }

    window.showUser = (id) => {
        const u = users.find(user => user.id === id);
        const content = document.getElementById('userContent');
        
        content.innerHTML = `
            <div class="detail-header">
                <img src="${u.avatar_url || 'https://ui-avatars.com/api/?name=' + (u.username || 'U') + '&background=6366f1&color=fff'}" class="detail-avatar shadow">
                <h4 class="fw-bold m-0 text-white">${u.username || 'Sin Nombre'}</h4>
                <span class="badge ${u.is_admin ? 'bg-primary' : 'bg-dark border border-secondary'} mt-2">
                    ${u.is_admin ? 'ADMINISTRADOR' : 'COLABORADOR'}
                </span>
            </div>
            
            <div class="mt-4 p-3 rounded-4" style="background: var(--field)">
                <label class="text-dim small fw-bold d-block mb-1">CORREO ELECTRÓNICO</label>
                <p class="m-0 text-white">${u.email}</p>
            </div>

            <div class="mt-3 p-3 rounded-4" style="background: var(--field)">
                <label class="text-dim small fw-bold d-block mb-1">FECHA DE REGISTRO</label>
                <p class="m-0 text-white">${new Date(u.created_at).toLocaleDateString()}</p>
            </div>

            <div class="mt-5">
                <button class="btn btn-outline-danger w-100 rounded-4 py-2" onclick="window.deleteUser('${u.id}')">
                    <i class="bi bi-person-x me-2"></i> Eliminar Usuario
                </button>
            </div>
        `;
        offcanvas.show();
    };

    window.deleteUser = async (id) => {
        const res = await Swal.fire({
            title: '¿Eliminar cuenta?',
            text: "El usuario perderá acceso total.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            background: '#0a0e17', color: '#fff'
        });

        if(res.isConfirmed) {
            // Nota: En Supabase real, para borrar de auth.users necesitas permisos de admin
            await supabase.from('profiles').delete().eq('id', id);
            offcanvas.hide();
            load();
        }
    }

    document.getElementById('userSearch').oninput = render;
    load();
</script>
</body>
</html>
