<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Varian | Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root { 
            --bg: #05070a; --surface: #0a0e17; --field: #131926; 
            --accent: #6366f1; --text: #ffffff; --text-dim: #94a3b8; 
            --border: #1e293b;
        }
        
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        .app-shell { display: flex; height: 100vh; }

        /* --- SIDEBAR --- */
        .sidebar { width: 260px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; color: var(--accent); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-dim); text-decoration: none; border-radius: 12px; margin-bottom: 5px; font-weight: 600; }
        .nav-item:hover, .nav-item.active { background: var(--surface); color: var(--accent); }

        /* --- CONTENT LAYOUT --- */
        .content-area { flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 400px; }
        
        .editor-section { padding: 60px; }
        .preview-section { 
            background: var(--surface); 
            border-left: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 40px;
        }

        /* --- UI ELEMENTS --- */
        .field-group { margin-bottom: 25px; }
        .field-label { font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; display: block; }
        
        .minimal-input { 
            background: var(--field); 
            border: 2px solid transparent; 
            color: white; 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            outline: none; 
            transition: 0.3s;
        }
        .minimal-input:focus { border-color: var(--accent); background: #1a2234; }
        .minimal-input:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- AVATAR --- */
        .avatar-container { position: relative; margin-bottom: 30px; }
        .profile-pic { 
            width: 200px; height: 200px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 5px solid var(--bg); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .upload-btn {
            position: absolute; bottom: 10px; right: 10px;
            background: var(--accent); color: white;
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 4px solid var(--surface); transition: 0.2s;
        }
        .upload-btn:hover { transform: scale(1.1); }

        /* --- MOBILE --- */
        @media (max-width: 991px) {
            .sidebar { width: 100%; height: 70px; position: fixed; bottom: 0; flex-direction: row; padding: 5px; z-index: 1000; border-top: 1px solid var(--border); border-right: none; }
            .brand, .nav-item span { display: none; }
            .nav-links { display: flex; width: 100%; justify-content: space-around; align-items: center; }
            .content-area { grid-template-columns: 1fr; padding-bottom: 100px; }
            .editor-section { padding: 30px; order: 2; }
            .preview-section { border-left: none; border-bottom: 1px solid var(--border); padding: 50px 20px; order: 1; }
            .profile-pic { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>

<div class="app-shell">
    <nav class="sidebar">
        <div class="brand"><i class="bi bi-vimeo"></i> <span>VARIAN</span></div>
        <div class="nav-links">
            <a href="index.html" class="nav-item"><i class="bi bi-cloud-arrow-up"></i> <span>Subir</span></a>
            <a href="canciones.html" class="nav-item"><i class="bi bi-music-note-list"></i> <span>Catálogo</span></a>
            <a href="usuarios.html" class="nav-item"><i class="bi bi-people"></i> <span>Usuarios</span></a>
            <a href="perfil.html" class="nav-item active"><i class="bi bi-person-circle"></i> <span>Perfil</span></a>
        </div>
    </nav>

    <main class="content-area">
        <section class="editor-section">
            <h2 class="fw-800 mb-2">Configuración</h2>
            <p class="text-dim mb-5">Administra tu identidad en la plataforma.</p>

            <div class="field-group">
                <label class="field-label">Nombre de Usuario</label>
                <input type="text" id="username" class="minimal-input" placeholder="Tu apodo...">
            </div>

            <div class="field-group">
                <label class="field-label">Correo Electrónico</label>
                <input type="email" id="email" class="minimal-input" disabled>
                <small class="text-dim mt-2 d-block">El correo no puede ser modificado por seguridad.</small>
            </div>

            <div class="mt-5">
                <button id="saveProfile" class="btn btn-primary w-100 py-3 rounded-4 fw-bold shadow">
                    <i class="bi bi-check2-circle me-2"></i> GUARDAR CAMBIOS
                </button>
                <button id="logoutBtn" class="btn btn-link w-100 mt-3 text-danger text-decoration-none fw-600">
                    Cerrar Sesión
                </button>
            </div>
        </section>

        <section class="preview-section">
            <div class="avatar-container">
                <img id="avatarImg" src="https://ui-avatars.com/api/?name=U&background=131926&color=fff" class="profile-pic">
                <label for="avatarFile" class="upload-btn">
                    <i class="bi bi-camera-fill"></i>
                </label>
                <input type="file" id="avatarFile" hidden accept="image/*">
            </div>
            
            <h3 id="displayUsername" class="fw-bold mb-1">---</h3>
            <p id="displayRole" class="badge bg-dark border border-secondary text-dim px-3">Usuario</p>
        </section>
    </main>
</div>

<script type="module">
    import { supabase } from "../../assets/js/supabase.js";

    // Cargar perfil al inicio
    async function loadProfile() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = 'login.html'; // Redirigir si no hay sesión
            return;
        }

        const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
        
        if (profile) {
            document.getElementById('username').value = profile.username || '';
            document.getElementById('displayUsername').textContent = profile.username || 'Sin Nombre';
            document.getElementById('email').value = profile.email || user.email;
            
            if (profile.avatar_url) {
                document.getElementById('avatarImg').src = profile.avatar_url;
            }

            if (profile.is_admin) {
                document.getElementById('displayRole').textContent = 'Administrador';
                document.getElementById('displayRole').className = 'badge bg-primary px-3';
            }
        }
    }

    // Guardar cambios
    document.getElementById('saveProfile').onclick = async () => {
        const { data: { user } } = await supabase.auth.getUser();
        const username = document.getElementById('username').value;

        const { error } = await supabase.from('profiles').update({ username }).eq('id', user.id);

        if (!error) {
            Swal.fire({
                icon: 'success',
                title: 'Perfil actualizado',
                background: '#0a0e17', color: '#fff', confirmButtonColor: '#6366f1'
            });
            document.getElementById('displayUsername').textContent = username;
        }
    };

    // Subir Avatar
    document.getElementById('avatarFile').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const { data: { user } } = await supabase.auth.getUser();
        const fileExt = file.name.split('.').pop();
        const fileName = `${user.id}-${Math.random()}.${fileExt}`;
        const filePath = `avatars/${fileName}`;

        // Mostrar cargando
        Swal.showLoading();

        // 1. Subir a Storage (Bucket debe llamarse 'avatars')
        const { error: uploadError } = await supabase.storage.from('avatars').upload(filePath, file);

        if (uploadError) {
            Swal.fire('Error al subir', uploadError.message, 'error');
            return;
        }

        // 2. Obtener URL pública
        const { data: { publicUrl } } = supabase.storage.from('avatars').getPublicUrl(filePath);

        // 3. Actualizar tabla profiles
        await supabase.from('profiles').update({ avatar_url: publicUrl }).eq('id', user.id);

        document.getElementById('avatarImg').src = publicUrl;
        Swal.fire({ icon: 'success', title: 'Foto actualizada', background: '#0a0e17', color: '#fff' });
    };

    // Cerrar Sesión
    document.getElementById('logoutBtn').onclick = async () => {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
    };

    loadProfile();
</script>
</body>
</html>
