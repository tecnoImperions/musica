<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Varian Studio | Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">



    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg: #05070a; --surface: #0a0e17; --field: #131926;
            --accent: #6366f1; --text: #ffffff; --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        
        .app-shell { display: flex; height: 100vh; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px; background: var(--bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 25px; transition: 0.3s;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; color: var(--accent); }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: var(--text-dim); text-decoration: none; border-radius: 12px; margin-bottom: 5px; font-weight: 600;
        }
        .nav-item:hover, .nav-item.active { background: var(--surface); color: var(--accent); }
        .btn-logout { background: transparent; border: 1px solid #ef444433; color: #ef4444; width: 100%; padding: 12px; border-radius: 12px; margin-top: auto; transition: 0.3s; }
        .btn-logout:hover { background: #ef444411; }

        /* --- ÁREA DE CONTENIDO --- */
        .content-area { flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 400px; }
        .editor-section { padding: 40px; }
        .preview-section { padding: 40px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 25px; }

        /* --- INPUTS --- */
        .field-label { font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; display: block; }
        .minimal-input { 
            background: var(--field); border: 2px solid transparent; color: white; 
            width: 100%; padding: 14px; border-radius: 14px; outline: none; transition: 0.3s;
        }
        .minimal-input:focus { border-color: var(--accent); background: #1a2234; }

        /* Estilo para los Inputs de Archivo */
        .file-upload-wrapper {
            background: var(--field); border: 1px dashed var(--border);
            padding: 20px; border-radius: 14px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .file-upload-wrapper:hover { border-color: var(--accent); background: #1a2234; }
        .file-upload-wrapper input[type="file"] { display: none; }

        /* --- PORTADA PREVIEW --- */
        .cover-zone {
            width: 100%; aspect-ratio: 1; background: var(--field); border: 2px dashed var(--border);
            border-radius: 24px; overflow: hidden; position: relative; display: flex;
            align-items: center; justify-content: center; transition: 0.3s;
        }
        .cover-zone:hover { border-color: var(--accent); transform: scale(1.02); }
        .cover-zone img { width: 100%; height: 100%; object-fit: cover; }
        .drop-content { text-align: center; color: var(--text-dim); }

        /* --- GÉNEROS TAGS --- */
        .genre-tag {
            background: var(--accent); color: white; padding: 5px 15px;
            border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
        }

        .search-results {
            position: absolute; width: 100%; background: #161b2c;
            border: 1px solid var(--border); border-radius: 12px; z-index: 100;
            margin-top: 5px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .result-item { padding: 12px 15px; cursor: pointer; transition: 0.2s; color: var(--text-dim); }
        .result-item:hover { background: var(--accent); color: white; }

        /* --- RESPONSIVE --- */
        @media (max-width: 991px) {
            .sidebar {
                width: 100%; height: 70px; position: fixed; bottom: 0; flex-direction: row; 
                padding: 10px; border-right: none; border-top: 1px solid var(--border); z-index: 1000;
            }
            .brand, .nav-item span, .btn-logout span { display: none; }
            .nav-links { display: flex; width: 100%; justify-content: space-around; align-items: center; }
            .btn-logout { width: auto; margin-top: 0; border: none; }
            .content-area { grid-template-columns: 1fr; padding-bottom: 100px; }
            .preview-section { border-left: none; border-top: 1px solid var(--border); }
        }
    </style>
</head>

<body>

<div class="app-shell">

<nav class="sidebar">
<div class="brand"><i class="bi bi-vimeo"></i> <span>VARIAN</span></div>

<div class="nav-links">
<a href="index.html" class="nav-item active"><i class="bi bi-cloud-arrow-up"></i><span>Subir</span></a>
<a href="canciones.html" class="nav-item"><i class="bi bi-music-note-list"></i><span>Catálogo</span></a>
<a href="usuarios.html" class="nav-item"><i class="bi bi-people"></i><span>Usuarios</span></a>
<a href="perfil.html" class="nav-item"><i class="bi bi-person-circle"></i><span>Perfil</span></a>
</div>

<button id="btnLogout" class="btn-logout">
<i class="bi bi-box-arrow-left"></i><span>Cerrar Sesión</span>
</button>
</nav>

<main class="content-area">

<section class="editor-section">

<h2 class="fw-800 mb-4">Nueva Obra</h2>

<div class="field-group mb-4">
<label class="field-label">Título de la Canción</label>
<input
type="text"
id="titulo"
class="minimal-input"
placeholder="Ej: Moonlight Sonata (Varian Remix)"
required
maxlength="120">
</div>

<div class="row">

<div class="col-md-12 mb-4 position-relative">
<label class="field-label">Artista Principal</label>

<div class="d-flex gap-2">
<input
type="text"
id="artistSearch"
class="minimal-input"
placeholder="Buscar artista existente..."
autocomplete="off"
required>

<button
class="btn btn-primary px-3 rounded-4"
data-bs-toggle="offcanvas"
data-bs-target="#panelAdd"
onclick="setContext('artist')">

<i class="bi bi-person-plus-fill"></i>
</button>
</div>

<div id="artistResults" class="search-results d-none"></div>
</div>

<div class="col-md-12 mb-4 position-relative">

<label class="field-label">Géneros</label>

<div class="d-flex gap-2">
<input
type="text"
id="genreSearch"
class="minimal-input"
placeholder="Ej: Tech House, Melodic..."
autocomplete="off">

<button
class="btn btn-primary px-3 rounded-4"
data-bs-toggle="offcanvas"
data-bs-target="#panelAdd"
onclick="setContext('genre')">

<i class="bi bi-plus-lg"></i>
</button>
</div>

<div id="genreResults" class="search-results d-none"></div>
<div id="selectedGenresList" class="mt-3 d-flex flex-wrap gap-2"></div>

</div>
</div>

<div class="row g-3 mt-2">

<div class="col-md-6">
<label class="field-label">Master Audio (WAV/MP3)</label>

<label class="file-upload-wrapper w-100">
<i class="bi bi-music-note-beamed fs-3 text-primary mb-2 d-block"></i>

<span id="audioName" class="small text-dim">
Seleccionar Audio
</span>

<input type="file" id="audio" accept="audio/*" required>
</label>
</div>

<div class="col-md-6">
<label class="field-label">Video Clip (Opcional)</label>

<label class="file-upload-wrapper w-100">
<i class="bi bi-play-btn fs-3 text-accent mb-2 d-block"></i>

<span id="videoName" class="small text-dim">
Seleccionar Video
</span>

<input type="file" id="video" accept="video/mp4">
</label>
</div>

</div>

</section>

<section class="preview-section">

<label class="field-label">Artwork / Portada</label>

<div
class="cover-zone"
onclick="document.getElementById('cover').click()">

<img id="previewImg" style="display:none">

<div id="dropText" class="drop-content">
<i class="bi bi-cloud-arrow-up fs-1 mb-2"></i>
<p class="m-0 fw-600">Subir Imagen</p>
<span class="small opacity-50">
3000 x 3000 px recomendado
</span>
</div>

<input type="file" id="cover" hidden accept="image/*" required>

</div>

<div class="mt-auto">

<div
class="p-3 rounded-4 mb-3"
style="background:rgba(99,102,241,0.1);
border:1px solid rgba(99,102,241,0.2);">

<p class="small m-0 text-dim">
<i class="bi bi-info-circle me-2"></i>
Al publicar, la obra estará disponible instantáneamente en el catálogo global.
</p>

</div>

<button
id="agregarCancion"
class="btn btn-primary w-100 py-3 fw-bold rounded-4 shadow-lg"
style="font-size:1.1rem;letter-spacing:1px">

PUBLICAR LANZAMIENTO

</button>

</div>

</section>

</main>
</div>

<div
class="offcanvas offcanvas-end"
id="panelAdd"
style="background:var(--surface);
color:white;
border-left:1px solid var(--accent);
width:400px">

<div class="offcanvas-header border-bottom border-secondary">
<h5 id="panelTitle" class="fw-bold m-0">Añadir Nuevo</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="offcanvas">
</button>

</div>

<div class="offcanvas-body p-4">

<div class="mb-4">
<label class="field-label">Nombre</label>

<input
type="text"
id="newName"
class="minimal-input"
placeholder="Escribe aquí..."
maxlength="80">
</div>

<button
id="saveNewBtn"
class="btn btn-primary w-100 py-3 rounded-4 fw-bold">

GUARDAR REGISTRO
</button>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="../../assets/js/admin.js"></script>


<script>
function safeFileName(file){
return file ? file.name : "Seleccionar archivo";
}

audio.onchange=e=>{
audioName.innerText=safeFileName(e.target.files[0]);
};

video.onchange=e=>{
videoName.innerText=safeFileName(e.target.files[0]);
};

cover.onchange=e=>{
const file=e.target.files[0];
if(!file) return;

previewImg.src=URL.createObjectURL(file);
previewImg.style.display="block";
dropText.style.display="none";
};
</script>

</body>
</html>
