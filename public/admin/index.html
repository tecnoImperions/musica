<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Varian Studio | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg: #05070a; --surface: #0a0e17; --field: #131926;
            --accent: #6366f1; --text: #f1f5f9; --text-dim: #64748b;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }

        /* LAYOUT PRINCIPAL */
        .app-shell { display: flex; height: 100vh; width: 100vw; }

        /* SIDEBAR PRO */
        .sidebar {
            width: 260px; background: var(--bg); border-right: 1px solid #1e293b;
            display: flex; flex-direction: column; padding: 25px; transition: 0.3s;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; }
        .nav-links { flex-grow: 1; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: var(--text-dim); text-decoration: none; border-radius: 12px; margin-bottom: 5px; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: var(--surface); color: var(--accent); }
        .btn-logout { background: transparent; border: 1px solid #ef444433; color: #ef4444; width: 100%; padding: 12px; border-radius: 12px; }

        /* ÁREA DE CONTENIDO */
        .content-area { flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 400px; }
        .editor-section { padding: 40px; background: var(--surface); }
        .preview-section { padding: 40px; border-left: 1px solid #1e293b; display: flex; flex-direction: column; gap: 20px; }

        /* COMPONENTES DE CAMPO */
        .field-label { font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
        .minimal-input { background: var(--field); border: 2px solid transparent; color: white; width: 100%; padding: 14px; border-radius: 12px; outline: none; }
        .minimal-input:focus { border-color: var(--accent); }

        .search-results { position: absolute; width: 100%; background: #161b2c; border: 1px solid #262d45; border-radius: 0 0 12px 12px; z-index: 100; display: none; }
        .result-item { padding: 10px 15px; cursor: pointer; }
        .result-item:hover { background: var(--accent); }

        /* RESPONSIVE */
        @media (max-width: 991px) {
            .app-shell { flex-direction: column; overflow-y: auto; }
            .sidebar {
                width: 100%; height: 70px; position: fixed; bottom: 0; flex-direction: row; 
                padding: 10px; border-right: none; border-top: 1px solid #1e293b; z-index: 1000;
            }
            .content-area { grid-template-columns: 1fr; padding-bottom: 80px; }
            .brand, .nav-item span, .btn-logout span { display: none; }
            .nav-links { display: flex; width: 100%; justify-content: space-around; }
        }
    </style>
</head>
<body>

<div class="app-shell">
    <nav class="sidebar">
        <div class="brand"><i class="bi bi-vimeo text-primary"></i> <span>VARIAN</span></div>
        <div class="nav-links">
            <a href="index.html" class="nav-item active"><i class="bi bi-cloud-arrow-up"></i> <span>Subir Música</span></a>
            <a href="canciones.html" class="nav-item"><i class="bi bi-music-note-list"></i> <span>Mis Canciones</span></a>
            <a href="usuarios.html" class="nav-item"><i class="bi bi-people"></i> <span>Usuarios</span></a>
            <a href="perfil.html" class="nav-item"><i class="bi bi-person-circle"></i> <span>Mi Perfil</span></a>
        </div>
        <button id="btnLogout" class="btn-logout"><i class="bi bi-box-arrow-left"></i> <span>Cerrar Sesión</span></button>
    </nav>

    <main class="content-area">
        <section class="editor-section">
            <h2 class="fw-bold mb-4">Nueva Obra</h2>
            
            <div class="mb-4">
                <label class="field-label">Título</label>
                <input type="text" id="titulo" class="minimal-input" placeholder="Nombre oficial...">
            </div>

            <div class="mb-4 position-relative">
                <label class="field-label">Artista Principal</label>
                <div class="d-flex gap-2">
                    <input type="text" id="artistSearch" class="minimal-input" placeholder="Escribe para buscar..." autocomplete="off">
                    <button class="btn btn-primary rounded-3" data-bs-toggle="offcanvas" data-bs-target="#panelAdd" onclick="setContext('artist')"><i class="bi bi-plus"></i></button>
                </div>
                <div id="artistResults" class="search-results"></div>
            </div>

            <div class="mb-4 position-relative">
                <label class="field-label">Géneros</label>
                <div class="d-flex gap-2">
                    <input type="text" id="genreSearch" class="minimal-input" placeholder="Añadir géneros..." autocomplete="off">
                    <button class="btn btn-primary rounded-3" data-bs-toggle="offcanvas" data-bs-target="#panelAdd" onclick="setContext('genre')"><i class="bi bi-plus"></i></button>
                </div>
                <div id="genreResults" class="search-results"></div>
                <div id="selectedGenresList" class="mt-2 d-flex flex-wrap gap-2"></div>
            </div>

            <div class="row g-3 mt-4">
                <div class="col-md-6">
                    <label class="field-label">Archivo Audio</label>
                    <input type="file" id="audio" class="form-control bg-dark border-0 text-white p-3 rounded-4">
                </div>
                <div class="col-md-6">
                    <label class="field-label">Video (MP4)</label>
                    <input type="file" id="video" class="form-control bg-dark border-0 text-white p-3 rounded-4">
                </div>
            </div>
        </section>

        <section class="preview-section">
            <label class="field-label">Arte de Portada</label>
            <div class="cover-zone" style="cursor:pointer; background: var(--field); border: 2px dashed #262d45; aspect-ratio:1; border-radius:20px; overflow:hidden; position:relative;" onclick="document.getElementById('cover').click()">
                <img id="previewImg" style="width:100%; height:100%; object-fit:cover; display:none;">
                <div id="dropText" class="m-auto text-center opacity-25">
                    <i class="bi bi-image fs-1"></i><p>Subir Portada</p>
                </div>
                <input type="file" id="cover" hidden accept="image/*">
            </div>
            <button id="agregarCancion" class="btn btn-primary py-3 fw-bold rounded-4 mt-auto shadow-lg">PUBLICAR LANZAMIENTO</button>
        </section>
    </main>
</div>

<div class="offcanvas offcanvas-end" id="panelAdd" style="background:var(--surface); color:white; border-left: 1px solid var(--accent);">
    <div class="offcanvas-header border-bottom border-secondary">
        <h5 id="panelTitle">Añadir</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <label class="field-label">Nombre</label>
        <input type="text" id="newName" class="minimal-input mb-4">
        <button id="saveNewBtn" class="btn btn-primary w-100 py-3 rounded-4">Guardar</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
