<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Varian | Catálogo Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root { 
            --bg: #05070a; --surface: #0a0e17; --field: #131926; 
            --accent: #6366f1; --text: #ffffff; --text-dim: #94a3b8; 
            --border: #1e293b;
        }
        
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .app-shell { display: flex; height: 100vh; }

        .sidebar { width: 260px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; color: var(--accent); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-dim); text-decoration: none; border-radius: 12px; margin-bottom: 5px; font-weight: 600; }
        .nav-item:hover, .nav-item.active { background: var(--surface); color: var(--accent); }

        .content-area { flex-grow: 1; overflow-y: auto; padding: 40px; background: var(--bg); }
        .filter-bar { background: var(--surface); padding: 15px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 25px; }

        #listaMobile { display: none; }
        .table-responsive { display: block; }

        .table { --bs-table-bg: transparent; border-color: var(--border); margin: 0; }
        .table tbody td { color: var(--text) !important; border-bottom-color: #0f172a; padding: 16px 10px; vertical-align: middle; }
        .table thead th { color: var(--text-dim) !important; font-size: 11px; text-transform: uppercase; border: none; padding-bottom: 15px; }
        
        .song-img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--field); }
        .song-title { color: var(--text) !important; font-weight: 700; }
        
        .minimal-input { background: var(--field); border: 1px solid var(--border); color: white !important; padding: 12px 14px; border-radius: 10px; outline: none; width: 100%; transition: 0.3s; }
        
        .search-results-floating { 
            position: absolute; top: 100%; left: 0; right: 0; 
            background: #131926; border: 1px solid var(--border); 
            border-radius: 12px; z-index: 2050; max-height: 220px; 
            overflow-y: auto; margin-top: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .result-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #1e293b; color: #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
        .result-item:hover { background: var(--accent); color: white; }

        .genre-tag { background: rgba(99, 102, 241, 0.1); color: var(--accent); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; border: 1px solid var(--accent); display: inline-flex; align-items: center; margin: 2px; }

        .btn-icon { background: var(--field); border: 1px solid var(--border); color: var(--text-dim); padding: 10px 14px; border-radius: 12px; }

        @media (max-width: 991px) {
            .sidebar { width: 100%; height: 70px; position: fixed; bottom: 0; flex-direction: row; padding: 5px; z-index: 1000; border-top: 1px solid var(--border); }
            .brand, .nav-item span { display: none; }
            .nav-links { display: flex; width: 100%; justify-content: space-around; }
            .content-area { padding: 20px 15px 100px 15px; }
            .table-responsive { display: none !important; }
            #listaMobile { display: block !important; }
            .mobile-card { display: flex; background: var(--surface); border: 1px solid var(--border); padding: 16px; border-radius: 20px; margin-bottom: 12px; align-items: center; gap: 15px; }
            .offcanvas { width: 100% !important; }
        }
    </style>
</head>
<body>

<div class="app-shell">
    <nav class="sidebar">
        <div class="brand"><i class="bi bi-vimeo"></i> <span>VARIAN</span></div>
        <div class="nav-links">
            <a href="index.html" class="nav-item"><i class="bi bi-cloud-arrow-up"></i> <span>Subir</span></a>
            <a href="canciones.html" class="nav-item active"><i class="bi bi-music-note-list"></i> <span>Catálogo</span></a>
            <a href="usuarios.html" class="nav-item"><i class="bi bi-people"></i> <span>Usuarios</span></a>
            <a href="perfil.html" class="nav-item"><i class="bi bi-person-circle"></i> <span>Perfil</span></a>
        </div>
    </nav>

    <main class="content-area">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0">Catálogo Musical</h3>
            <span class="badge bg-primary rounded-pill px-3" id="totalCount">0 Temas</span>
        </div>

        <div class="filter-bar d-flex align-items-center gap-3">
            <div class="position-relative flex-grow-1">
                <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-dim"></i>
                <input type="text" id="searchInput" class="minimal-input ps-5" placeholder="Buscar título o artista...">
            </div>
            <select id="pageSize" class="minimal-input w-auto d-none d-md-block">
                <option value="10" selected>10 filas</option>
                <option value="25">25 filas</option>
            </select>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Obra</th>
                        <th>Artista</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaDesktop"></tbody>
            </table>
        </div>
        <div id="listaMobile"></div>

        <div class="d-flex justify-content-between align-items-center mt-4 mb-5">
            <button id="prevPage" class="btn-icon"><i class="bi bi-chevron-left"></i></button>
            <span id="pageLabel" class="small fw-bold text-dim">Página 1</span>
            <button id="nextPage" class="btn-icon"><i class="bi bi-chevron-right"></i></button>
        </div>
    </main>
</div>

<div class="offcanvas offcanvas-end" id="editorPanel" style="background: var(--surface); color: white; border-left: 1px solid var(--border); width: 450px;">
    <div class="offcanvas-header border-bottom border-secondary p-4">
        <h5 class="fw-bold m-0">Editar Canción</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-4">
        <input type="hidden" id="editId">
        
        <div class="mb-4">
            <label class="small text-dim fw-bold mb-2 d-block">TÍTULO DE LA OBRA</label>
            <input type="text" id="editTitulo" class="minimal-input">
        </div>

        <div class="mb-4 position-relative">
            <label class="small text-dim fw-bold mb-2 d-block">ARTISTA</label>
            <input type="text" id="artistSearch" class="minimal-input" placeholder="Buscar o crear artista...">
            <div id="artistResults" class="search-results-floating d-none"></div>
        </div>

        <div class="mb-4 position-relative">
            <label class="small text-dim fw-bold mb-2 d-block">GÉNEROS</label>
            <input type="text" id="genreSearch" class="minimal-input" placeholder="Buscar o crear géneros...">
            <div id="genreResults" class="search-results-floating d-none"></div>
            <div id="selectedGenresList" class="mt-3"></div>
        </div>

        <button id="btnUpdate" class="btn btn-primary w-100 py-3 rounded-4 fw-bold shadow-lg mt-3">
            <i class="bi bi-save2 me-2"></i>GUARDAR CAMBIOS
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { supabase } from "../../assets/js/supabase.js";

    let songs = [];
    let dbArtists = [];
    let dbGenres = [];
    let currentPage = 1;
    let selectedArtistId = null;
    let selectedGenresIds = [];

    const offcanvas = new bootstrap.Offcanvas('#editorPanel');

    async function init() {
        const { data: s } = await supabase.from('songs').select('*, artists(id, name)').order('created_at', {ascending: false});
        const { data: a } = await supabase.from('artists').select('*').order('name');
        const { data: g } = await supabase.from('genres').select('*').order('name');

        songs = s || [];
        dbArtists = a || [];
        dbGenres = g || [];

        setupSmartSearch("artistSearch", "artistResults", dbArtists, "artists", (item) => {
            selectedArtistId = item.id;
        });

        setupSmartSearch("genreSearch", "genreResults", dbGenres, "genres", (item) => {
            if (!selectedGenresIds.includes(item.id)) {
                selectedGenresIds.push(item.id);
                renderSelectedGenres();
            }
        });

        document.getElementById('totalCount').textContent = `${songs.length} Temas`;
        render();
    }

    function setupSmartSearch(inputId, resultsId, dataArray, tableName, onSelect) {
        const input = document.getElementById(inputId);
        const results = document.getElementById(resultsId);

        input.addEventListener('input', () => {
            const term = input.value.trim();
            results.innerHTML = "";
            if (!term) { results.classList.add("d-none"); return; }

            const filtered = dataArray.filter(x => x.name.toLowerCase().includes(term.toLowerCase())).slice(0, 5);

            filtered.forEach(item => {
                const div = document.createElement("div");
                div.className = "result-item";
                div.innerHTML = `<span>${item.name}</span> <i class="bi bi-check2"></i>`;
                div.onclick = () => {
                    onSelect(item);
                    if (inputId === "artistSearch") input.value = item.name;
                    else input.value = "";
                    results.classList.add("d-none");
                };
                results.appendChild(div);
            });

            if (!dataArray.find(x => x.name.toLowerCase() === term.toLowerCase())) {
                const addDiv = document.createElement("div");
                addDiv.className = "result-item";
                addDiv.innerHTML = `<span class="text-white">Crear "<strong>${term}</strong>"</span> <i class="bi bi-plus-circle text-primary"></i>`;
                addDiv.onclick = async () => {
                    // AQUÍ ESTABA EL ERROR: Necesitamos capturar el ID del nuevo registro
                    const { data, error } = await supabase.from(tableName).insert([{ name: term }]).select().single();
                    if (!error) {
                        dataArray.push(data); // Lo agregamos al catálogo local
                        onSelect(data);       // Pasamos el nuevo ID al estado de edición
                        if (inputId === "artistSearch") input.value = data.name;
                        else input.value = "";
                        results.classList.add("d-none");
                    }
                };
                results.appendChild(addDiv);
            }
            results.classList.remove("d-none");
        });
    }

    function renderSelectedGenres() {
        const container = document.getElementById("selectedGenresList");
        container.innerHTML = selectedGenresIds.map(id => {
            const g = dbGenres.find(x => x.id === id);
            return `<span class="genre-tag">${g?.name} <i class="bi bi-x-circle-fill ms-2" style="cursor:pointer" onclick="window.removeGenre('${id}')"></i></span>`;
        }).join("");
    }

    window.removeGenre = (id) => {
        selectedGenresIds = selectedGenresIds.filter(x => x !== id);
        renderSelectedGenres();
    };

    window.prepareEdit = async (id) => {
        const song = songs.find(s => s.id === id);
        if (!song) return;
        
        document.getElementById('editId').value = song.id;
        document.getElementById('editTitulo').value = song.titulo;
        selectedArtistId = song.artists?.id || null;
        document.getElementById('artistSearch').value = song.artists?.name || "";

        const { data: current } = await supabase.from('song_genres').select('genre_id').eq('song_id', id);
        selectedGenresIds = current ? current.map(c => c.genre_id) : [];
        renderSelectedGenres();
        offcanvas.show();
    };

    document.getElementById('btnUpdate').onclick = async () => {
        const songId = document.getElementById('editId').value;
        const titulo = document.getElementById('editTitulo').value;

        if(!songId || !selectedArtistId) {
            Swal.fire({ icon: 'error', title: 'Faltan datos', background: '#0a0e17', color: '#fff' });
            return;
        }

        try {
            // 1. Actualizar tabla principal
            const { error: songError } = await supabase.from('songs').update({ 
                titulo: titulo, 
                artist_id: selectedArtistId 
            }).eq('id', songId);
            if(songError) throw songError;

            // 2. Limpiar relaciones anteriores
            await supabase.from('song_genres').delete().eq('song_id', songId);

            // 3. Insertar todas las relaciones actuales (incluyendo el nuevo género)
            if (selectedGenresIds.length > 0) {
                const inserts = selectedGenresIds.map(gid => ({
                    song_id: songId,
                    genre_id: gid
                }));
                const { error: insError } = await supabase.from('song_genres').insert(inserts);
                if(insError) throw insError;
            }

            offcanvas.hide();
            Swal.fire({ icon: 'success', title: '¡Guardado!', background: '#0a0e17', color: '#fff', timer: 2000 });
            init();
        } catch (e) {
            Swal.fire({ icon: 'error', title: 'Error', text: e.message, background: '#0a0e17', color: '#fff' });
        }
    };

    function render() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = songs.filter(s => s.titulo.toLowerCase().includes(query) || (s.artists?.name || '').toLowerCase().includes(query));
        const size = parseInt(document.getElementById('pageSize').value);
        const start = (currentPage - 1) * size;
        const paginated = filtered.slice(start, start + size);

        document.getElementById('listaDesktop').innerHTML = paginated.map(s => `
            <tr>
                <td>
                    <div class="d-flex align-items-center gap-3">
                        <img src="${s.thumbnail_url || ''}" class="song-img" onerror="this.src='https://via.placeholder.com/50'">
                        <span class="song-title">${s.titulo}</span>
                    </div>
                </td>
                <td class="text-dim">${s.artists?.name || '---'}</td>
                <td class="text-end">
                    <button class="btn-icon me-1" onclick="window.prepareEdit('${s.id}')"><i class="bi bi-pencil"></i></button>
                    <button class="btn-icon" onclick="window.confirmDelete('${s.id}')" style="color:#ef4444"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
        `).join('');

        document.getElementById('listaMobile').innerHTML = paginated.map(s => `
            <div class="mobile-card">
                <img src="${s.thumbnail_url || ''}" class="song-img" onerror="this.src='https://via.placeholder.com/50'">
                <div class="flex-grow-1 overflow-hidden">
                    <span class="song-title d-block text-truncate">${s.titulo}</span>
                    <small class="text-dim">${s.artists?.name || '---'}</small>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn-icon p-2" onclick="window.prepareEdit('${s.id}')"><i class="bi bi-pencil"></i></button>
                    <button class="btn-icon p-2" onclick="window.confirmDelete('${s.id}')" style="color:#ef4444"><i class="bi bi-trash"></i></button>
                </div>
            </div>
        `).join('');

        document.getElementById('pageLabel').textContent = `Página ${currentPage}`;
        document.getElementById('prevPage').disabled = currentPage === 1;
        document.getElementById('nextPage').disabled = (start + size) >= filtered.length;
    }

    window.confirmDelete = async (id) => {
        if ((await Swal.fire({ title: '¿Eliminar?', icon: 'warning', showCancelButton: true, background: '#0a0e17', color: '#fff' })).isConfirmed) {
            await supabase.from('songs').delete().eq('id', id);
            init();
        }
    };

    document.getElementById('searchInput').oninput = () => { currentPage = 1; render(); };
    document.getElementById('prevPage').onclick = () => { if(currentPage > 1) { currentPage--; render(); } };
    document.getElementById('nextPage').onclick = () => { currentPage++; render(); };

    init();
</script>
</body>
</html>
