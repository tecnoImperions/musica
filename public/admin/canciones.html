<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Varian | Catálogo Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root { 
            --bg: #05070a; --surface: #0a0e17; --field: #131926; 
            --accent: #6366f1; --text: #ffffff; --text-dim: #94a3b8; 
            --border: #1e293b;
        }
        
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        .app-shell { display: flex; height: 100vh; }

        /* --- SIDEBAR --- */
        .sidebar { width: 260px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; color: var(--accent); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-dim); text-decoration: none; border-radius: 12px; margin-bottom: 5px; font-weight: 600; }
        .nav-item:hover, .nav-item.active { background: var(--surface); color: var(--accent); }

        /* --- CONTENIDO --- */
        .content-area { flex-grow: 1; overflow-y: auto; padding: 40px; background: var(--bg); }
        .filter-bar { background: var(--surface); padding: 15px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 25px; }

        /* --- TABLA (COLORES CORREGIDOS) --- */
        .table { --bs-table-bg: transparent; border-color: var(--border); margin: 0; }
        .table tbody td { color: var(--text) !important; border-bottom-color: #0f172a; padding: 16px 10px; }
        .table thead th { color: var(--text-dim) !important; font-size: 11px; text-transform: uppercase; border: none; padding-bottom: 15px; }
        
        .song-title { color: var(--text) !important; font-weight: 700; }
        .song-artist { color: var(--text-dim) !important; font-size: 0.9rem; }
        .song-img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
        
        /* --- CARDS MÓVIL --- */
        .mobile-card { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 12px; align-items: center; gap: 15px; }

        /* --- CONTROLES --- */
        .minimal-input { background: var(--field); border: 1px solid var(--border); color: white !important; padding: 8px 12px; border-radius: 10px; outline: none; }
        .btn-icon { background: var(--field); border: 1px solid var(--border); color: var(--text-dim); padding: 8px 12px; border-radius: 10px; transition: 0.3s; }
        .btn-icon:hover { color: var(--accent); border-color: var(--accent); }

        .pagination-btn { background: var(--field); border: 1px solid var(--border); color: var(--text); padding: 6px 16px; border-radius: 8px; font-size: 14px; }
        .pagination-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        @media (max-width: 991px) {
            .sidebar { width: 100%; height: 70px; position: fixed; bottom: 0; flex-direction: row; padding: 5px; z-index: 1000; border-top: 1px solid var(--border); border-right: none; }
            .brand, .nav-item span { display: none; }
            .nav-links { display: flex; width: 100%; justify-content: space-around; align-items: center; }
            .content-area { padding: 20px 15px 100px 15px; }
            .table-responsive { display: none; }
            .mobile-card { display: flex; }
            .filter-bar { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="app-shell">
    <nav class="sidebar">
        <div class="brand"><i class="bi bi-vimeo"></i> <span>VARIAN</span></div>
        <div class="nav-links">
            <a href="index.html" class="nav-item"><i class="bi bi-cloud-arrow-up"></i> <span>Subir</span></a>
            <a href="canciones.html" class="nav-item active"><i class="bi bi-music-note-list"></i> <span>Catálogo</span></a>
            <a href="usuarios.html" class="nav-item"><i class="bi bi-people"></i> <span>Usuarios</span></a>
            <a href="perfil.html" class="nav-item"><i class="bi bi-person-circle"></i> <span>Perfil</span></a>
        </div>
    </nav>

    <main class="content-area">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0">Catálogo Musical</h3>
            <span class="badge bg-primary rounded-pill px-3" id="totalCount">0 Temas</span>
        </div>

        <div class="filter-bar d-flex align-items-center gap-3">
            <div class="position-relative flex-grow-1">
                <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-dim"></i>
                <input type="text" id="searchInput" class="minimal-input w-100 ps-5" placeholder="Buscar por nombre o artista...">
            </div>
            <select id="pageSize" class="minimal-input">
                <option value="5">5 filas</option>
                <option value="10" selected>10 filas</option>
                <option value="25">25 filas</option>
                <option value="999999">Todas</option>
            </select>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Obra</th>
                        <th>Artista</th>
                        <th>Género</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaDesktop"></tbody>
            </table>
        </div>

        <div id="listaMobile"></div>

        <div class="d-flex justify-content-between align-items-center mt-4 mb-5">
            <button id="prevPage" class="pagination-btn"><i class="bi bi-chevron-left me-1"></i> Anterior</button>
            <span id="pageLabel" class="small fw-bold text-dim">Página 1</span>
            <button id="nextPage" class="pagination-btn">Siguiente <i class="bi bi-chevron-right ms-1"></i></button>
        </div>
    </main>
</div>

<div class="offcanvas offcanvas-end" id="editorPanel" style="background: var(--surface); color: white; border-left: 1px solid var(--border);">
    <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="fw-bold m-0 text-white">Editar Canción</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <input type="hidden" id="editId">
        <div class="mb-3">
            <label class="small text-dim fw-bold mb-2 d-block">TÍTULO</label>
            <input type="text" id="editTitulo" class="minimal-input w-100">
        </div>
        <div class="mb-3">
            <label class="small text-dim fw-bold mb-2 d-block">ARTISTA</label>
            <input type="text" id="editArtista" class="minimal-input w-100">
        </div>
        <div class="mb-4">
            <label class="small text-dim fw-bold mb-2 d-block">GÉNERO</label>
            <input type="text" id="editGenero" class="minimal-input w-100">
        </div>
        <button id="btnUpdate" class="btn btn-primary w-100 py-3 rounded-4 fw-bold shadow">GUARDAR CAMBIOS</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { supabase } from "../../assets/js/supabase.js";

    let songs = [];
    let currentPage = 1;
    const offcanvas = new bootstrap.Offcanvas('#editorPanel');

    async function load() {
        const { data, error } = await supabase.from('songs').select('*').order('created_at', {ascending: false});
        if (!error) {
            songs = data;
            document.getElementById('totalCount').textContent = `${songs.length} Temas`;
            render();
        }
    }

    function render() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = songs.filter(s => s.titulo.toLowerCase().includes(query) || s.artista.toLowerCase().includes(query));
        
        const size = parseInt(document.getElementById('pageSize').value);
        const start = (currentPage - 1) * size;
        const end = start + size;
        const paginated = filtered.slice(start, end);

        // Render Desktop
        document.getElementById('listaDesktop').innerHTML = paginated.map(s => `
            <tr>
                <td>
                    <div class="d-flex align-items-center gap-3">
                        <img src="${s.thumbnail_url || ''}" class="song-img">
                        <span class="song-title">${s.titulo}</span>
                    </div>
                </td>
                <td class="song-artist">${s.artista}</td>
                <td><span class="badge bg-dark border border-secondary text-dim">${s.genero || 'Estándar'}</span></td>
                <td class="text-end">
                    <button class="btn-icon me-1" onclick="window.prepareEdit('${s.id}', '${s.titulo}', '${s.artista}', '${s.genero}')"><i class="bi bi-pencil"></i></button>
                    <button class="btn-icon" onclick="window.confirmDelete('${s.id}')" style="color:#ef4444"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
        `).join('');

        // Render Mobile
        document.getElementById('listaMobile').innerHTML = paginated.map(s => `
            <div class="mobile-card">
                <img src="${s.thumbnail_url || ''}" class="song-img">
                <div style="flex:1">
                    <div class="fw-bold text-white text-truncate" style="max-width:140px">${s.titulo}</div>
                    <div class="text-dim small">${s.artista}</div>
                </div>
                <div class="d-flex flex-column gap-2">
                    <button class="btn-icon" onclick="window.prepareEdit('${s.id}', '${s.titulo}', '${s.artista}', '${s.genero}')"><i class="bi bi-pencil"></i></button>
                    <button class="btn-icon" onclick="window.confirmDelete('${s.id}')" style="color:#ef4444"><i class="bi bi-trash"></i></button>
                </div>
            </div>
        `).join('');

        // Info de paginación
        document.getElementById('pageLabel').textContent = `Página ${currentPage}`;
        document.getElementById('prevPage').disabled = currentPage === 1;
        document.getElementById('nextPage').disabled = end >= filtered.length;
    }

    // Funciones globales
    window.prepareEdit = (id, t, a, g) => {
        document.getElementById('editId').value = id;
        document.getElementById('editTitulo').value = t;
        document.getElementById('editArtista').value = a;
        document.getElementById('editGenero').value = g !== 'null' ? g : '';
        offcanvas.show();
    };

    document.getElementById('btnUpdate').onclick = async () => {
        const id = document.getElementById('editId').value;
        const { error } = await supabase.from('songs').update({
            titulo: document.getElementById('editTitulo').value,
            artista: document.getElementById('editArtista').value,
            genero: document.getElementById('editGenero').value
        }).eq('id', id);

        if(!error) {
            offcanvas.hide();
            Swal.fire({ icon: 'success', title: 'Actualizado', background: '#0a0e17', color: '#fff' });
            load();
        }
    };

    window.confirmDelete = async (id) => {
        const res = await Swal.fire({
            title: '¿Eliminar canción?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            background: '#0a0e17', color: '#fff'
        });
        if(res.isConfirmed) {
            await supabase.from('songs').delete().eq('id', id);
            load();
        }
    };

    // Eventos
    document.getElementById('searchInput').oninput = () => { currentPage = 1; render(); };
    document.getElementById('pageSize').onchange = () => { currentPage = 1; render(); };
    document.getElementById('prevPage').onclick = () => { if(currentPage > 1) { currentPage--; render(); } };
    document.getElementById('nextPage').onclick = () => { currentPage++; render(); };

    load();
</script>
</body>
</html>
